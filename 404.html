<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 404 (Not Found)!!1</title>
  <style>
    body {
      font-family: arial, sans-serif;
      color: #222;
      background: #fff;
      margin: 7% auto 0;
      max-width: 390px;
      min-height: 180px;
      padding: 30px 0 15px;
    }
    p {
      margin: 11px 0 22px;
      overflow: hidden;
    }
    ins {
      color: #777;
      text-decoration: none;
    }
    strong {
      color: #000;
    }
  </style>
</head>
<body>
  <p><b>404.</b> <ins>That’s an error.</ins></p>
  <p>The requested URL <strong id="invalid-path"></strong> was not found on this server. <ins>That’s all we know.</ins></p>

  <script>
    // 開こうとしたURLのパス（例: /aaaa）を取得して <strong> タグに埋め込む
    document.getElementById('invalid-path').textContent = window.location.pathname;
  </script>
</body>
</html>
