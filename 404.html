<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error 404 (Not Found)!!1</title>

  <link rel="icon" href="https://cdn.01.next-meta-cloud.com/fav/IMG_0611.jpeg" type="image/jpeg">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: arial, sans-serif;
      color: #222;
    }

    .main-container {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-35%);
      width: 90%;
      max-width: 600px;
      text-align: left;
    }

    .brand-logo {
      font-size: 60px;
      font-weight: bold;
      color: #000;
      text-decoration: none;
      margin-bottom: 20px;
      letter-spacing: -2px;
      display: inline-block;
    }

    .brand-logo:hover {
      text-decoration: underline;
    }

    .error-text {
      max-width: 350px;
      float: left;
    }

    p {
      margin: 11px 0 22px;
      overflow: hidden;
      line-height: 1.4;
    }
    ins {
      color: #777;
      text-decoration: none;
    }
    strong {
      color: #000;
    }

    .robot-img {
      float: right;
      margin-top: -30px;
      width: 180px;
      height: auto;
    }

    @media (max-width: 600px) {
      .main-container {
        left: 5%;
        transform: none;
      }
      .robot-img {
        float: none;
        display: block;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <a href="https://policies.next-meta.com" class="brand-logo">NextMeta</a>
    <img class="robot-img" src="https://www.google.com/images/errors/robot.png" alt="Robot error">

    <div class="error-text">
      <p><b>404.</b> <ins>That’s an error.</ins></p>
      <p>The requested URL <strong id="invalid-path"></strong> was not found on this server. <ins>That’s all we know.</ins></p>
    </div>
  </div>

  <script>
    document.getElementById('invalid-path').textContent = window.location.pathname;
  </script>
</body>
</html>
